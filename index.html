<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book a Course</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <main>
        <section class="form-wraper">
            <form id="course-form" action="mailto:challenge@dn-uk.com" method="post" enctype="text/plain">
                <div class="form-group">
                    <label for="fullName">Name :</label>
                    <input type="text" id="fullName" name="fullName" placeholder="Enter Your Name" required
                        onblur="validateName()">
                    <span id="nameError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="email">Email :</label>
                    <input type="email" name="email" id="email" placeholder="Enter Your Email" required>
                    <span id="emailError" class="error-message"></span>
                </div>
                <div class="form-group">
                    <label for="card">Card: </label>
                    <input type="text" id="card" name="card" placeholder="Enter a Proxy Credit Card Number" required
                        onblur="validateCard()">
                    <span id="cardError" class="error-message"></span>
                </div>
                <div class="form-group submit-button">
                    <button type="submit" id="submitBtn">Submit</button>
                </div>
            </form>
        </section>
    </main>
</body>

</html>
